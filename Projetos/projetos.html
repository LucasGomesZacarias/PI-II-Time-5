<!DOCTYPE html>
<!-- Autor: Luiz Felipe da Conceição. Tela de Projetos do sistema Nexo. -->
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo - Projetos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="api.js"></script>
  <script defer src="script.js"></script>
  <!-- componente da barra de navegação (precisa vir depois do script.js) -->
  <script type="module" src="/componentes/libComps.js"></script>
</head>
<body>
  <!-- barra de navegação -->
  <comp-navbar pagina-atual="projetos"></comp-navbar>

  <main class="container py-4">
    <section class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h1 class="fw-bold mb-1">Projetos</h1>
        <p class="text-muted mb-0">Quem cria um projeto vira o líder dele e escolhe quem participa.</p>
      </div>

      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoProjeto">
        Novo projeto
      </button>
    </section>

    <div id="areaMensagem" class="alert alert-info">
      Carregando projetos...
    </div>

    <section class="row g-3" id="listaProjetos"></section>
  </main>

  <!-- Modal: novo projeto -->
  <div class="modal fade" id="modalNovoProjeto" tabindex="-1" aria-labelledby="tituloNovoProjeto" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <!-- novalidate desliga a validação do navegador, a validação é feita pelo JavaScript -->
        <form onsubmit="criarProjeto(event)" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="tituloNovoProjeto">Novo projeto</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>

          <div class="modal-body">
            <label for="nomeProjeto" class="form-label">Nome do projeto</label>
            <input type="text" id="nomeProjeto" class="form-control" maxlength="100" placeholder="Ex.: Sistema de Vendas">
            <div class="invalid-feedback" id="erroNomeProjeto"></div>
            <p class="text-muted small mt-2 mb-0">Você será o líder deste projeto.</p>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Criar projeto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: pessoas do projeto -->
  <div class="modal fade" id="modalMembros" tabindex="-1" aria-labelledby="tituloModalMembros" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModalMembros">Projeto</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <div id="areaMensagemMembros" class="d-none"></div>

          <div class="table-responsive mb-3">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Papel</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaMembros"></tbody>
            </table>
          </div>

          <!-- aparece só para o líder e o administrador -->
          <div id="areaAdicionar" class="d-none">
            <p class="form-label mb-2">Adicionar pessoas ao projeto</p>

            <div class="form-check border-bottom pb-2 mb-2">
              <input class="form-check-input" type="checkbox" id="marcarTodos" onchange="marcarTodosCandidatos(this.checked)">
              <label class="form-check-label" for="marcarTodos">Marcar todas</label>
            </div>

            <div id="listaCandidatos" class="lista-candidatos mb-3"></div>

            <button type="button" class="btn btn-primary" id="botaoAdicionar" onclick="adicionarMembros()">
              Adicionar selecionadas
            </button>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
