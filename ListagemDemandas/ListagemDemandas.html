<!DOCTYPE html>
<html lang="pt-BR">

<!-- Lucas Gomes Zacarias - RA 26003288 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="Listagem.css">
    <script type="module" src="/componentes/libComps.js"></script>
    <title>Nexo - Lista de Demandas</title>
</head>

<body>

    <comp-navbar pagina-atual="demandas"></comp-navbar>

    <main id="demandas">

        <section class="apresentacao">

            <div>
                <p class="subtitulo">Gestão de Operações</p>

                <h1>Todas as Demandas</h1>

                <p class="descricao">
                    Pesquise, filtre e acesse os detalhes das demandas
                    registradas no sistema de acordo com seu perfil de acesso.
                </p>
            </div>
            <a href="/CadastroDemanda/cadastroDemanda.html">
                <button class="botao" type="button">
                    + Nova Demanda
                </button>
            </a>

        </section>

        <form-demandas></form-demandas>

        <lista-demandas id="minha-lista"></lista-demandas>

    </main>
    <script>
         async function carregarDemandas(filtros = {}) {
        // espera os componentes serem registrados pelo libComps.js (que é um módulo)
        await customElements.whenDefined('lista-demandas');

        try {
            const params = new URLSearchParams(filtros);
            const resposta = await fetch('/demandas?' + params);
            const dados = await resposta.json();

            if (!resposta.ok) {
                alert(dados.mensagem);
                return;
            }

            document.getElementById('minha-lista').demandas = dados;
        } catch (erro) {
            console.error(erro);
            alert("Não foi possível carregar as demandas.");
        }
    }

    // quando o usuário clica em Filtrar, busca com os filtros escolhidos
    document.querySelector('form-demandas').addEventListener('filtrar', (evento) => {
        carregarDemandas(evento.detail);
    });

    // carrega a lista completa ao abrir a página
    carregarDemandas();
    </script>

    <footer>
        <p>
            nexo. - Sistema de acompanhamento de demandas de desenvolvimento
        </p>
    </footer>

</body>

</html>
