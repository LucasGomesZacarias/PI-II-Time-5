<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="Listagem.css">
    <script type="module" src="/componentes/libComps.js"></script>
    <title>Nexo - Lista de Demandas</title>
</head>

<body>

    <comp-navbar pagina-atual="demandas"></comp-navbar>

    <main id="demandas">

        <section class="apresentacao">

            <div>
                <p class="subtitulo">Gestão de Operações</p>

                <h1>Todas as Demandas</h1>

                <p class="descricao">
                    Pesquise, filtre e acesse os detalhes das demandas
                    registradas no sistema de acordo com seu perfil de acesso.
                </p>
            </div>
            <a href="/CadastroDemanda/cadastroDemanda.html">
                <button class="botao" type="button">
                    + Nova Demanda
                </button>
            </a>

        </section>

        <form-demandas></form-demandas>

        <lista-demandas id="minha-lista"></lista-demandas>

    </main>

    <button id="btn-carregar" class="botao" style="margin-bottom: 20px;">
        Mostrar Demandas ficticias
    </button>

    <script>
    function carregarDemandas() {
        const dadosSimulados = [
            {
                id: 1041,
                codigo: "DEM-1041",
                titulo: "Corrigir validação de prazo",
                projeto: "Nexo",
                tipo: "Defeito",
                prioridade: "Crítica",
                classePrioridade: "critica", 
                status: "Aberta",
                classeStatus: "aberta", 
                responsavel: "Ana Ferreira",
                dataCriacao: "10/09/2026",
                prazo: "14/09/2026"
            },
            {
                id: 1045,
                codigo: "DEM-1045",
                titulo: "Implementar filtro no painel",
                projeto: "Alpha ERP",
                tipo: "Melhoria",
                prioridade: "Média",
                classePrioridade: "media",
                status: "Em andamento",
                classeStatus: "andamento",
                responsavel: "Caio Lima",
                dataCriacao: "11/09/2026",
                prazo: "19/09/2026"
            }
        ];

        const componenteLista = document.getElementById('minha-lista');
        componenteLista.demandas = dadosSimulados; 
    }

    const botao = document.getElementById('btn-carregar');
    botao.addEventListener('click', carregarDemandas);

</script>

    <footer>
        <p>
            nexo. - Sistema de acompanhamento de demandas de desenvolvimento
        </p>
    </footer>

</body>

</html>
