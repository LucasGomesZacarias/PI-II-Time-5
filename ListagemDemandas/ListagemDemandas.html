<!DOCTYPE html>
<html lang="pt-BR">

<!-- Lucas Gomes Zacarias - RA 26003288 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="Listagem.css">
    <script type="module" src="/componentes/libComps.js"></script>
    <title>Nexo - Lista de Demandas</title>
</head>

<body>

    <comp-navbar pagina-atual="demandas"></comp-navbar>

    <main id="demandas">

        <section class="apresentacao">

            <div>
                <p class="subtitulo">Gestão de Operações</p>

                <h1>Todas as Demandas</h1>

                <p class="descricao">
                    Pesquise, filtre e acesse os detalhes das demandas
                    registradas no sistema de acordo com seu perfil de acesso.
                </p>
            </div>
            <a href="/CadastroDemanda/cadastroDemanda.html">
                <button class="botao" type="button">
                    + Nova Demanda
                </button>
            </a>

        </section>

        <form-demandas></form-demandas>

        <lista-demandas id="minha-lista"></lista-demandas>

    </main>

    <script type="module">
    // A listagem e os detalhes consultam os mesmos dados de demonstração.
    import { listarDemandasExemplo } from "/componentes/demandasExemplo.js";

    function carregarDemandas() {
        const dadosSimulados = listarDemandasExemplo().map(demanda => ({
            ...demanda,
            classePrioridade: { "Crítica": "critica", "Alta": "alta", "Média": "media", "Baixa": "baixa" }[demanda.prioridade] ?? "baixa",
            classeStatus: { "Aberta": "aberta", "Em andamento": "andamento", "Concluída": "concluida" }[demanda.status] ?? "aberta"
        }));
        const componenteLista = document.getElementById('minha-lista');
        componenteLista.demandas = dadosSimulados;
    }

    carregarDemandas();

</script>

    <footer>
        <p>
            nexo. - Sistema de acompanhamento de demandas de desenvolvimento
        </p>
    </footer>

</body>

</html>
